<!doctype html>
<html>
  <head>
    <title>Honeywell - My Total Connect Comfort</title>
  </head>
  <body>
    <!-- Abridged from the login page the portal answers to a refused login
     (recorded in kk7ds/somecomfort's test cassettes). The last paragraph is
     not on the real page: it checks that a static mention of a lock is not
     taken for a locked account. -->
    <div id="login">
      <h2>Already have an account?</h2>
      <form action="/portal" method="post">
        <div class="validation-summary-errors">
          <span>Login was unsuccessful.</span>
          <ul>
            <li style="display: none"></li>
          </ul>
        </div>
        <div class="editor-label"><label for="UserName">Email Address</label></div>
        <div class="editor-field">
          <input
            autocomplete="off"
            class="input-validation-error"
            data-val="true"
            data-val-email="The email address is not in the correct format."
            data-val-required="This field is required."
            id="UserName"
            name="UserName"
            type="text"
            value=""
          />
        </div>
        <div class="editor-label">
          <label for="Password">My Total Connect Comfort Password</label>
        </div>
        <div class="editor-field"><input id="Password" name="Password" type="password" /></div>
        <input type="submit" value="Login" />
        <a href="/portal/Account/ForgotPassword">Forgot Password?</a>
      </form>
    </div>
    <p>Account locked? Contact customer care.</p>
  </body>
</html>
